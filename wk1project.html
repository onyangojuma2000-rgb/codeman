
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View current weather, a 3-day forecast, and country information.">
  <title>City Weather Dashboard</title>

  <style>
    :root {
      --primary: #2563eb;
      --background: #f1f5f9;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --border: #e2e8f0;
      --error: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dbeafe, var(--background));
      color: var(--text);
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      color: #1d4ed8;
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      line-height: 1.6;
    }

    .search-card,
    .card {
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 5px 20px rgb(15 23 42 / 5%);
    }

    .search-form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: var(--primary);
    }

    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    #status.error {
      color: var(--error);
    }

    /* Loading spinner */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px 15px;
      text-align: center;
      color: var(--primary);
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dbeafe;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-container p {
      margin: 0;
      font-weight: 600;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 22px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .current-weather {
      background: linear-gradient(145deg, #1d4ed8, #38bdf8);
      color: white;
    }

    .location {
      font-size: 23px;
      font-weight: bold;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
    }

    .weather-main img {
      width: 90px;
      height: 90px;
    }

    .temperature {
      font-size: 44px;
      font-weight: bold;
    }

    .description {
      text-transform: capitalize;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .detail {
      padding: 12px;
      border-radius: 10px;
      background: rgb(255 255 255 / 15%);
      line-height: 1.7;
    }

    .muted {
      color: var(--muted);
    }

    .forecast-list {
      display: grid;
      gap: 10px;
    }

    .forecast-day {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .forecast-day img {
      width: 45px;
      height: 45px;
    }

    .forecast-temp {
      white-space: nowrap;
      font-weight: bold;
    }

    .country-flag {
      display: block;
      width: 110px;
      max-height: 75px;
      object-fit: contain;
      margin-bottom: 16px;
      border-radius: 5px;
    }

    .country-info p {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 650px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }

      .search-form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .card,
      .search-card {
        padding: 17px;
      }

      .forecast-day {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>🌤️ City Weather Dashboard</h1>
      <p>Discover current weather, a 3-day forecast, and country information.</p>
    </header>

    <!-- City search form -->
    <section class="search-card">
      <form id="searchForm" class="search-form">
        <input
          id="cityInput"
          type="text"
          placeholder="Enter a city, e.g. Nairobi"
          aria-label="City name"
          maxlength="100"
          required
        >
        <button id="searchButton" type="submit">
          Search Weather
        </button>
      </form>

      <p id="status" role="status" aria-live="polite">
        Enter a city to get started.
      </p>
    </section>

    <!-- Loading spinner -->
    <div
      id="loading"
      class="loading-container"
      role="status"
      aria-live="polite"
      hidden
    >
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Loading weather information...</p>
    </div>

    <!-- Dashboard results -->
    <section id="dashboard" class="dashboard" hidden>
      <article class="card current-weather">
        <h2>Current Weather</h2>
        <div id="currentContent"></div>
      </article>

      <article class="card">
        <h2>3-Day Forecast</h2>
        <div id="forecastContent" class="forecast-list"></div>
      </article>

      <article class="card country-info full-width">
        <h2>Country Information</h2>
        <div id="countryContent"></div>
      </article>
    </section>

    <footer>
      Weather data: OpenWeatherMap.
      Country data: REST Countries.
    </footer>
  </main>

  <script>
    "use strict";

    // Replace this placeholder with your OpenWeatherMap API key.
    const API_KEY = "f25e05a3c7cf295d7f283af0458f93e4";

    const WEATHER_BASE =
      "https://api.openweathermap.org/data/2.5";

    const GEOCODING_URL =
      "https://api.openweathermap.org/geo/1.0/direct";

    const COUNTRY_BASE =
      "https://restcountries.com/v3.1";

    // HTML elements
    const form = document.getElementById("searchForm");
    const cityInput = document.getElementById("cityInput");
    const searchButton = document.getElementById("searchButton");
    const statusMessage = document.getElementById("status");
    const dashboard = document.getElementById("dashboard");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");

    const currentContent =
      document.getElementById("currentContent");

    const forecastContent =
      document.getElementById("forecastContent");

    const countryContent =
      document.getElementById("countryContent");

    // Display status and error messages
    function setStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle("error", isError);
    }

    // Fetch JSON data and handle HTTP errors
    async function fetchJSON(url) {
      const response = await fetch(url);
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        if (response.status === 401) {
          throw new Error(
            "Invalid API key or the key is not active yet."
          );
        }

        if (response.status === 404) {
          throw new Error(
            "No matching data found. Check the city name."
          );
        }

        throw new Error(
          data.message ||
          `Request failed (HTTP ${response.status}).`
        );
      }

      return data;
    }

    // Safely create HTML elements
    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    // Format a forecast date
    function formatDay(dateString) {
      const [year, month, day] =
        dateString.split("-").map(Number);

      const date = new Date(year, month - 1, day, 12);

      return date.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric"
      });
    }

    // Render current weather
    function renderCurrentWeather(weather) {
      currentContent.replaceChildren();

      const location = createElement(
        "div",
        "location",
        `${weather.name}, ${weather.sys.country}`
      );

      const weatherMain =
        createElement("div", "weather-main");

      const icon = document.createElement("img");

      icon.src =
        `https://openweathermap.org/img/wn/${weather.weather[0].icon}@2x.png`;

      icon.alt = weather.weather[0].description;

      const temperatureBox = document.createElement("div");

      temperatureBox.append(
        createElement(
          "div",
          "temperature",
          `${Math.round(weather.main.temp)}°C`
        ),
        createElement(
          "div",
          "description",
          weather.weather[0].description
        )
      );

      weatherMain.append(icon, temperatureBox);

      const details = createElement("div", "details");

      const values = [
        ["Feels like", `${Math.round(weather.main.feels_like)}°C`],
        ["Humidity", `${weather.main.humidity}%`],
        ["Wind speed", `${weather.wind.speed} m/s`],
        ["Pressure", `${weather.main.pressure} hPa`]
      ];

      values.forEach(([label, value]) => {
        const item = createElement("div", "detail");

        item.append(
          createElement("div", "", label),
          createElement("strong", "", value)
        );

        details.append(item);
      });

      currentContent.append(location, weatherMain, details);
    }

    // Render a 3-day forecast using the 5-day / 3-hour API
    function renderForecast(forecast) {
      forecastContent.replaceChildren();

      const days = new Map();

      forecast.list.forEach((item) => {
        const date = item.dt_txt.split(" ")[0];

        if (!days.has(date)) {
          days.set(date, []);
        }

        days.get(date).push(item);
      });

      const selectedDays = [...days.entries()]
        .slice(0, 3)
        .map(([date, entries]) => {
          const best = entries.reduce((closest, item) => {
            const hour =
              Number(item.dt_txt.slice(11, 13));

            const closestHour =
              Number(closest.dt_txt.slice(11, 13));

            return Math.abs(hour - 12) <
              Math.abs(closestHour - 12)
              ? item
              : closest;
          });

          return { date, weather: best };
        });

      selectedDays.forEach(({ date, weather }) => {
        const row = createElement("div", "forecast-day");

        const dayName = createElement(
          "strong",
          "",
          formatDay(date)
        );

        const icon = document.createElement("img");

        icon.src =
          `https://openweathermap.org/img/wn/${weather.weather[0].icon}.png`;

        icon.alt = weather.weather[0].description;

        const description = createElement(
          "span",
          "muted",
          weather.weather[0].description
        );

        const temperature = createElement(
          "span",
          "forecast-temp",
          `${Math.round(weather.main.temp_max)}° / ${Math.round(weather.main.temp_min)}°C`
        );

        row.append(
          dayName,
          icon,
          description,
          temperature
        );

        forecastContent.append(row);
      });

      if (selectedDays.length === 0) {
        forecastContent.textContent =
          "No forecast data is available.";
      }
    }

    // Render country information
    async function renderCountry(countryCode) {
      countryContent.replaceChildren();

      const fields =
        "name,capital,region,subregion,population,flags,cca2";

      const country = await fetchJSON(
        `${COUNTRY_BASE}/alpha/${encodeURIComponent(countryCode)}?fields=${fields}`
      );

      const flag = document.createElement("img");

      flag.className = "country-flag";
      flag.src = country.flags.svg || country.flags.png;
      flag.alt = `Flag of ${country.name.common}`;

      const details = document.createElement("div");

      const entries = [
        ["Country", country.name.common],
        [
          "Capital",
          country.capital?.join(", ") || "Not available"
        ],
        ["Region", country.region || "Not available"],
        ["Subregion", country.subregion || "Not available"],
        [
          "Population",
          Number(country.population).toLocaleString()
        ]
      ];

      entries.forEach(([label, value]) => {
        const paragraph = document.createElement("p");

        paragraph.append(
          createElement("strong", "", `${label}: `),
          document.createTextNode(value)
        );

        details.append(paragraph);
      });

      countryContent.append(flag, details);
    }

    // Load all dashboard data
    async function loadDashboard(city) {
      if (
        !API_KEY ||
        API_KEY === "YOUR_OPENWEATHERMAP_API_KEY"
      ) {
        throw new Error(
          "Add your OpenWeatherMap API key to the API_KEY variable."
        );
      }

      // Find city coordinates first
      const geoURL = new URL(GEOCODING_URL);

      geoURL.search = new URLSearchParams({
        q: city,
        limit: "1",
        appid: API_KEY
      });

      const locations =
        await fetchJSON(geoURL.toString());

      if (!locations.length) {
        throw new Error(
          "City not found. Check the spelling or add the country name."
        );
      }

      const place = locations[0];

      const params = new URLSearchParams({
        lat: place.lat,
        lon: place.lon,
        units: "metric",
        appid: API_KEY
      });

      // Fetch current weather and forecast together
      const [current, forecast] = await Promise.all([
        fetchJSON(`${WEATHER_BASE}/weather?${params}`),
        fetchJSON(`${WEATHER_BASE}/forecast?${params}`)
      ]);

      renderCurrentWeather(current);
      renderForecast(forecast);

      // Show weather even if country information fails
      dashboard.hidden = false;

      try {
        await renderCountry(current.sys.country);
      } catch (error) {
        countryContent.textContent =
          `Country information could not be loaded: ${error.message}`;
      }
    }

    // Handle searches and loading states
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const city = cityInput.value.trim();

      if (!city) {
        setStatus("Please enter a city name.", true);
        return;
      }

      // Show loading indicator
      searchButton.disabled = true;
      searchButton.textContent = "Loading...";
      dashboard.hidden = true;
      loading.hidden = false;

      loadingText.textContent =
        `Fetching weather for ${city}...`;

      setStatus(
        `Please wait while we retrieve data for ${city}.`
      );

      try {
        await loadDashboard(city);

        setStatus(
          `Weather information loaded for ${city}.`
        );
      } catch (error) {
        setStatus(
          error.message ||
          "Something went wrong. Please try again.",
          true
        );
      } finally {
        // Restore the interface after success or failure
        loading.hidden = true;
        searchButton.disabled = false;
        searchButton.textContent = "Search Weather";
      }
    });
  </script>
</body>
</html>
